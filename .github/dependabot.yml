version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current: Dependabot bumps the pin
  # and updates the trailing version comment when a new release ships.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Watch the single runtime dependency (argcomplete) and any build deps.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
